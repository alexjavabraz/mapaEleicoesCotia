<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mapa Eleitoral — Cotia — Eleição Geral</title>

  <!-- PWA -->
  <link rel="manifest" href="./manifest.json" />
  <meta name="theme-color" content="#16213e" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Cotia Eleição Geral" />
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
  <link rel="icon" type="image/svg+xml" href="./icons/cotia-flag.svg" />
  <link rel="icon" type="image/png" sizes="32x32" href="./icons/favicon-32.png" />

  <!-- Leaflet CSS -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    crossorigin=""
  />

  <!-- App CSS (reaproveitado da página municipal) -->
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <!-- ==============================
       HEADER
       ============================== -->
  <header id="header">
    <h1>
      Mapa Eleitoral de Cotia
      <span class="badge">Eleição Geral</span>
    </h1>

    <div id="controls">
      <select id="year-select" onchange="changeYear(this.value)"
              style="background:rgba(255,255,255,0.07);color:#fff;border:1px solid rgba(255,255,255,0.15);
                     border-radius:4px;padding:4px 8px;font-size:0.78rem">
        <option value="2022">2022</option>
        <option value="2026">2026</option>
      </select>
      <span style="font-size:0.72rem;color:var(--text-muted);margin-left:8px">
        Presidente · Governador · Senador · Dep. Federal · Dep. Estadual — Cotia/SP
      </span>
      <a href="./index.html" style="font-size:0.72rem;color:var(--text-muted);margin-left:16px;white-space:nowrap">
        ← Eleição Municipal 2024
      </a>
    </div>
  </header>

  <!-- ==============================
       ÁREA PRINCIPAL
       ============================== -->
  <div id="main">
    <!-- MAPA -->
    <div id="map-container">
      <div id="map"></div>

      <!-- Banner de aviso (sem dados / erro) -->
      <div id="no-data-banner"></div>
    </div>

    <!-- SIDEBAR com dados eleitorais -->
    <aside id="sidebar">
      <div id="sidebar-header">
        <h2>Selecione um bairro</h2>
      </div>
      <div id="sidebar-content">
        <div class="placeholder">
          <svg width="48" height="48" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="1.5">
            <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7z"/>
            <circle cx="12" cy="9" r="2.5"/>
          </svg>
          <p>Clique em um bairro no mapa para ver os resultados da zona eleitoral.</p>
        </div>
      </div>
    </aside>
  </div>

  <!-- ==============================
       LOADING OVERLAY
       ============================== -->
  <div id="loading">
    <div class="spinner"></div>
    <p>Carregando dados...</p>
    <span id="loading-status">Inicializando...</span>
  </div>

  <!-- ==============================
       SCRIPTS
       ============================== -->

  <!-- Leaflet JS -->
  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    crossorigin=""
  ></script>

  <!-- osmtogeojson: converte resposta Overpass OSM → GeoJSON -->
  <script src="https://unpkg.com/osmtogeojson@3.0.0-beta.4/osmtogeojson.js"></script>

  <!-- turf.js: computação de polígonos Voronoi para bairros -->
  <script src="https://cdn.jsdelivr.net/npm/@turf/turf@6.5.0/turf.min.js"></script>

  <!-- Módulos da aplicação -->
  <script src="js/tse.js"></script>
  <script src="js/map.js"></script>
  <script src="js/geral-config.js"></script>
  <script src="js/geral.js"></script>

  <!-- Service Worker (PWA) -->
  <script>
    if ("serviceWorker" in navigator) {
      // Recarrega automaticamente quando um novo SW assume o controle —
      // sem isso, quem já tem o app instalado fica preso na versão antiga
      // até fechar e reabrir o navegador várias vezes.
      let swRefreshing = false;
      navigator.serviceWorker.addEventListener("controllerchange", () => {
        if (swRefreshing) return;
        swRefreshing = true;
        window.location.reload();
      });
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./sw.js")
          .catch((err) => console.warn("SW registro falhou:", err));
      });
    }
  </script>
</body>
</html>
