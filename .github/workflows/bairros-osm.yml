name: Bairros de Cotia (OpenStreetMap)

on:
  workflow_dispatch:
  schedule:
    - cron: "0 9 1 * *"   # dia 1 de cada mês, 06:00 BRT
  push:
    branches: [claude/cache-mapa-2024-171431]
    paths:
      - scripts/download_bairros_osm.py
      - .github/workflows/bairros-osm.yml

permissions:
  contents: write

concurrency:
  group: bairros-osm-${{ github.ref }}
  cancel-in-progress: true

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python scripts/download_bairros_osm.py
      - name: Commit do JSON atualizado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/osm_bairros_cotia.json
          if git diff --cached --quiet; then
            echo "Sem mudanças."
          else
            git commit -m "dados: bairros de Cotia (OpenStreetMap)"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push
          fi
