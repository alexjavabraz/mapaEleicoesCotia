name: Gera votos por escola (TSE 2024)

on:
  workflow_dispatch:
  push:
    branches: [claude/votos-por-secao-2024-ls0944]
    paths:
      - scripts/download_secoes.py
      - .github/workflows/secoes.yml

permissions:
  contents: write

concurrency:
  group: secoes-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gerar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r scripts/requirements.txt
      # Baixa votacao_secao_2024_SP.zip (~475 MB) do CDN do TSE.
      # Só o detalhe por escola é commitado: os JSONs por bairro/escola já
      # publicados ficam como estão.
      - run: python scripts/download_secoes.py
      - name: Commit do JSON gerado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/cotia_votos_por_escola_detalhe.json
          if git diff --cached --quiet; then
            echo "Sem mudanças."
          else
            git commit -m "dados: votos por candidato em cada escola (TSE 2024)"
            git checkout -- data/   # descarta os outros JSONs regenerados
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push
          fi
