name: Patrimônio declarado 2024 (TSE)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/download_patrimonio.py
      - .github/workflows/patrimonio.yml

permissions:
  contents: write

concurrency:
  group: patrimonio-${{ github.ref }}
  cancel-in-progress: true

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python scripts/download_patrimonio.py
      - name: Commit do JSON atualizado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/patrimonio_candidatos_2024.json
          if git diff --cached --quiet; then
            echo "Sem mudanças."
          else
            git commit -m "dados: patrimônio declarado dos candidatos 2024 (TSE)"
            git pull --rebase
            git push
          fi
