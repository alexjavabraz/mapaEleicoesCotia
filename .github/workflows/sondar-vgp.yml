name: Sondagem de fontes (Vargem Grande Paulista)

on:
  workflow_dispatch:
  push:
    branches: [claude/project-thread-3h6zh7]
    paths:
      - scripts/comprovantes_vgp2.py
      - .github/workflows/sondar-vgp.yml

permissions:
  contents: read

jobs:
  comprovantes:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests && sudo apt-get install -y poppler-utils tesseract-ocr tesseract-ocr-por >/dev/null
      - run: python -u scripts/comprovantes_vgp2.py
