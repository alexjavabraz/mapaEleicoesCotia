<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title data-i18n>Mapa Eleitoral — Cotia 2024</title>

  <!-- PWA -->
  <link rel="manifest" href="./manifest.json" />
  <meta name="theme-color" content="#16213e" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Cotia 2024" />
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
  <link rel="icon" type="image/svg+xml" href="./icons/cotia-flag.svg" />
  <link rel="icon" type="image/png" sizes="32x32" href="./icons/favicon-32.png" />

  <!-- Idioma (PT/EN): carregado antes de tudo para os outros scripts usarem t() -->
  <script src="js/i18n.js"></script>

  <!-- Leaflet CSS -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    crossorigin=""
  />

  <!-- App CSS -->
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/abas.css" />
  <script type="text/javascript">
    (function(c,l,a,r,i,t,y){
        c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};
        t=l.createElement(r);t.async=1;t.src="https://www.clarity.ms/tag/"+i;
        y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y);
    })(window, document, "clarity", "script", "vmkk0a6thq");
  </script>
</head>
<body>
  <!-- ==============================
       HEADER
       ============================== -->
  <header id="header">
    <h1><img class="header-bandeira" src="./icons/cotia-flag.svg" alt="" width="28" height="28" /><span class="header-nome">Cotia</span></h1>

    <!-- Seções do site em controle segmentado (css/abas.css, js/abas.js) -->
    <nav class="segmentado segmentado--site" aria-label="Seções do site" data-i18n-aria-label>
      <a class="segmentado__aba" href="./index.html" aria-current="page"><span class="seg-longo" data-i18n>Eleições 2024</span><span class="seg-curto" data-i18n>2024</span></a>
      <a class="segmentado__aba" href="./eleicao-geral.html"><span class="seg-longo" data-i18n>Eleições 2026</span><span class="seg-curto" data-i18n>2026</span></a>
      <a class="segmentado__aba" href="./contas.html"><span class="seg-longo" data-i18n>Contas Municipais</span><span class="seg-curto" data-i18n>Contas</span></a>
    </nav>
  </header>

  <!-- ==============================
       ÁREA PRINCIPAL
       ============================== -->
  <div id="main">
    <!-- MAPA -->
    <div id="map-container">
      <div id="map"></div>

      <!-- Banner de aviso (sem dados / erro) -->
      <div id="no-data-banner"></div>
    </div>

    <!-- SIDEBAR com dados eleitorais -->
    <aside id="sidebar">
      <div id="sidebar-header">
        <h2 data-i18n>Selecione um bairro</h2>
      </div>
      <div id="sidebar-content">
        <div class="placeholder">
          <svg width="48" height="48" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="1.5">
            <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7z"/>
            <circle cx="12" cy="9" r="2.5"/>
          </svg>
          <p data-i18n>Clique em um bairro no mapa para ver os resultados eleitorais por zona eleitoral.</p>
        </div>
      </div>
    </aside>
  </div>

  <!-- ==============================
       LOADING OVERLAY
       ============================== -->
  <div id="loading">
    <div class="spinner"></div>
    <p data-i18n>Carregando dados...</p>
    <span id="loading-status" data-i18n>Inicializando...</span>
  </div>

  <!-- ==============================
       SCRIPTS
       ============================== -->

  <!-- Leaflet JS -->
  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    crossorigin=""
  ></script>

  <!-- osmtogeojson: converte resposta Overpass OSM → GeoJSON -->
  <script src="https://unpkg.com/osmtogeojson@3.0.0-beta.4/osmtogeojson.js"></script>

  <!-- turf.js: computação de polígonos Voronoi para bairros -->
  <script src="https://cdn.jsdelivr.net/npm/@turf/turf@6.5.0/turf.min.js"></script>

  <!-- Módulos da aplicação -->
  <script src="js/abas.js"></script>
  <script src="js/tse.js"></script>
  <script src="js/map.js"></script>
  <script src="js/app.js"></script>

  <!-- Service Worker (PWA) -->
  <script>
    if ("serviceWorker" in navigator) {
      // Recarrega automaticamente quando um novo SW assume o controle —
      // sem isso, quem já tem o app instalado fica preso na versão antiga
      // até fechar e reabrir o navegador várias vezes.
      let swRefreshing = false;
      navigator.serviceWorker.addEventListener("controllerchange", () => {
        if (swRefreshing) return;
        swRefreshing = true;
        window.location.reload();
      });
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./sw.js")
          .catch((err) => console.warn("SW registro falhou:", err));
      });
    }
  </script>
</body>
</html>
